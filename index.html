    <script>
      (function() {
        // In AI Studio preview environment, HMR WebSocket is disabled.
        // Intercept vite-hmr WebSocket requests to prevent connection rejection errors in the console.
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && (
              (event.reason.message && event.reason.message.includes('WebSocket')) ||
              (event.reason.stack && event.reason.stack.includes('createWebSocketModuleRunnerTransport'))
            )) {
              event.preventDefault();
              event.stopPropagation();
            }
          });
          window.addEventListener('error', function(event) {
            if (event.message && event.message.includes('WebSocket')) {
              event.preventDefault();
              event.stopPropagation();
            }
          });
          const OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              const isViteHmr = (typeof protocols === 'string' && protocols === 'vite-hmr') ||
                                (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                                (typeof url === 'string' && url.includes('token='));
              if (isViteHmr) {
                return {
                  readyState: 1,
                  OPEN: 1,
                  CONNECTING: 0,
                  CLOSING: 2,
                  CLOSED: 3,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(type, listener) {
                    if (type === 'open') setTimeout(listener, 0);
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; }
                };
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
            window.WebSocket.OPEN = OrigWebSocket.OPEN;
            window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
            window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
          }
        }
      })();
    </script>

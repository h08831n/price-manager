version: '3.8'

services:
  price_collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price_collector_app
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 only to prevent public conflict with other server services
      - "127.0.0.1:${APP_PORT:-3050}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Tehran
      - WORDPRESS_URL=${WORDPRESS_URL:-}
      - WORDPRESS_API_TOKEN=${WORDPRESS_API_TOKEN:-}
    volumes:
      # Persistent data: database, snapshots, screenshots
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 2048M

name: Deploy to Server on Push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /opt/price-collector
            
            # 1. Unset any skip-worktree or assume-unchanged flags from previous runs
            git update-index --no-skip-worktree data/database.json 2>/dev/null || true
            git update-index --no-assume-unchanged data/database.json 2>/dev/null || true
            
            # 2. Backup server's live database and backups before pulling
            mkdir -p /opt/price-collector/data_backup
            if [ -f data/database.json ]; then
              cp -f data/database.json /opt/price-collector/data_backup/database.json.bak
            fi
            
            # 3. Clean up git state, fetch latest code, and hard reset
            git checkout -f data/database.json 2>/dev/null || true
            git stash --include-untracked 2>/dev/null || true
            git fetch origin main
            git checkout -f origin/main 2>/dev/null || true
            git reset --hard origin/main
            
            # 4. Restore the server's live database (preserving all live products and settings)
            if [ -f /opt/price-collector/data_backup/database.json.bak ]; then
              cp -f /opt/price-collector/data_backup/database.json.bak data/database.json
            fi
            
            # 5. Rebuild and restart docker containers with latest code
            docker compose down
            docker compose up -d --build
            docker image prune -f

